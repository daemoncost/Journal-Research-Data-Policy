    text: Research Data Policy (RDP) exists.
    explanation: 'Reproducibility

      Open Data


      The journal strongly encourages authors to make all data associated with their
      submission openly available, according to the FAIR principles (Findable, Accessible,
      Interoperable, Reusable). This should be linked to from a Data Accessibility
      Statement within the submitted paper, which will be made public upon publication.
      . If data is not being made available with the journal publication then ideally
