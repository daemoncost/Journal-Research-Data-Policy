  0:
    text: Research Data Policy (RDP) exists.
    explanation: 'Key areas for improving the reproducibility of your article include:
      providing a detailed description of your research methodology; sharing your
      data in an online data repository; and uploading your code to an online code
      repository. '
  1:
    text: Research Data Policy (RDP) exists.
    explanation: 'IEEE Open Research Statement


      Consistent with its broad mission to advance technology for the benefit of humanity,
      IEEE is committed to the principles of open science. IEEE strongly supports
      the sharing of research processes, methods, data, code, and findings as openly
      as possible to promote collaboration, accelerate innovation, and advance scientific
      knowledge. IEEE likewise supports the transparent disclosure of peer review
      activities to ensure the quality, validity, and reliability of its scientific
      publications.


      All IEEE authors are encouraged to share their data, code, and other research
      outputs to facilitate verification and reproducibility of experiments and their
      conclusions.


      IEEE is committed to continuously improving the research infrastructure in its
      fields of interest to enable, facilitate, and foster adoption of these open
      science principles.'
  correct_answer: null
  discrepancy_reason: null
