  1:
    text: Public data sharing on a FAIR repository encouraged.
    explanation: 'Linking to the data underlying your work increases your exposure
      and may lead to new collaborations. It also provides readers with a better understanding
      of the described research.


      If your research data has been made available in a data repository there are
      a number of ways your article can be linked directly to the dataset:


      Provide a link to your dataset when prompted during the online submission process.


      For some data repositories, a repository banner will automatically appear next
      to your published article on ScienceDirect.


      You can also link relevant data or entities within the text of your article
      through the use of identifiers. Use the following format: Database: 12345 (e.g.
      TAIR: AT1G01020; CCDC: 734053; PDB: 1XFN).'
