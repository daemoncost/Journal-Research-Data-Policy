data_sharing:
  text: 3. Data sharing requirements in RDP
  N. encoders: 1
  has_discrepancies: false
  0:
    text: Data sharing encouraged but optional.
    explanation: 'Is it compulsory to share my research data?

      No. Our policy is clear in that we encourage and support authors to share their
      research data rather than mandating them to do so, and provide tools and services
      to enable them to do this effectively. Where there is community support for
      (often discipline-specific) mandates regarding data deposit, submission and
      sharing, some of our journals may reflect this with their own mandatory data
      sharing policies. Please check your journal''s guide for authors for specific
      information.'
  correct_answer: null
  discrepancy_reason: null
