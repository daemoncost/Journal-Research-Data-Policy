data_sharing:
  text: 3. Data sharing requirements in RDP
  N. encoders: 1
  has_discrepancies: false
  0:
    text: Data sharing encouraged but optional.
    explanation: 'This journal requires and enables you to share data that supports
      your research publication where appropriate, and enables you to interlink the
      data with your published articles. Research data refers to the results of observations
      or experimentation that validate research findings. To facilitate reproducibility
      and data reuse, this journal also encourages you to share your software, code,
      models, algorithms, protocols, methods and other useful materials related to
      the project.

      Below are a number of ways in which you can associate data with your article
      or make a statement about the availability of your data when submitting your
      manuscript. When sharing data in one of these ways, you are expected to cite
      the data in your manuscript and reference list. Please refer to the "References"
      section for more information about data citation. For more information on depositing,
      sharing and using research data and other relevant research materials, visit
      the research data page.

      '
  correct_answer: null
  discrepancy_reason: null
