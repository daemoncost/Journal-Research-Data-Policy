  N. encoders: 1
  has_discrepancies: false
  0:
    text: Required according to the RDP.
    explanation: 'To foster transparency, you are required to state the availability
      of any data at submission.


      Ensuring data is available may be a requirement of your funding body or institution.
      If your data is unavailable to access or unsuitable to post, you can state the
      reason why (e.g., your research data includes sensitive or confidential information
      such as patient data) during the submission process. This statement will appear
      with your published article on ScienceDirect.


      Read more about the importance and benefits of providing a data statement.'
