data_recommended:
  text: '11. Unique policies for data types

    Please name all data types for which unique policies are recommended according
    to the RDP (Please separate all data types be semicolon, e.g. crystal structures;
    Protein sequence)'
  N. encoders: 2
  has_discrepancies: true
  0:
    text: "Supply all supplementary material in standard file formats. Specialized\
      \ format such as .pdb (chemical), .wrl (VRML), .nb (Mathematica notebook), and\
      \ .tex can also be supplied.\n-XRD data are presented as the structural formula\
      \ of a molecule with numbered atoms or as a crystal lattice and tables. Along\
      \ with crystallographic data (cell parameters, space group, etc.), in the experimental\
      \ part, authors should specify the device with which the measurements were performed\
      \ and the methods (programs) used for decrypting structures and for calculations\n\
      It is recommended to present spectroscopic data as follows: \n- In electron\
      \ spectra, wavelengths (in nm) or wavenumbers (in cm\u20131 ) are given on the\
      \ abscissa in ascending order from left to right. The logarithm of the molar\
      \ absorption coefficient or, if needed, molar absorption coefficient is presented\
      \ on the ordinate axis. In the text and tables, the positions of extrema are\
      \ designated as \u03BBmax and \u03BBmin \uF02D IR and Raman spectra themselves\
      \ are usually not presented. They are described in order of decreasing wavenumbers.\
      \ An example of such a description is as follows. IR spectrum, \u03BD, cm \u2013\
      1 : 3350 br (NH, NOH), 2100 o.s (C\u2261N), 1700\u20131600 s (C=O, C=N). If\
      \ the spectra are given, the wavenumbers (cm\u20131 ) (in descending order from\
      \ left to right) or frequencies in accordance with the scale of the spectrometer\
      \ are placed along the lower abscissa axis; the upper abscissa axis can reflect\
      \ wavelength data (\xB5m). The left ordinate axis presents transmittance (%)\
      \ or absorbance (for IR spectra) or intensity (for Raman spectra) \uF02D In\
      \ NMR spectra, millionths of a field (ppm) are given on the abscissa axis; the\
      \ maximum signal of a solvent or a reference sample may be outside the graph\
      \ field. It is recommended to present scaled-down photocopies of the experimental\
      \ spectra. In describing spectra, signal types are indicated in abbreviated\
      \ form: s, singlet; d, doublet; t, triplet; q, quartet; quint, quintet; and\
      \ m, multiplet. Proton chemical shifts are given in the \u03B4 scale, for example,\
      \ \u03B4 5.24 m. Chemical shifts of nuclei 13C, 31P, etc., are given in accordance\
      \ with IUPAC recommendations: a shift into the weak field with a \u201C+;\u201D\
      \ and into a strong field, with a \u201C\u2013.\u201D Signals are recorded in\
      \ order of increasing \u03B4 values\n-Mass spectra are presented as numerical\
      \ values m/z and relative intensities of ion currents in a row, in order of\
      \ decreasing ion mass, \n- In the case of GC, the brand and model of instrument,\
      \ detector, and recording conditions, i.e., temperature, length and diameter\
      \ of the column, column packing, solid inert carrier, and carrier gas, should\
      \ be specified in the experimental part. For HPLC, it is necessary to indicate\
      \ the brand and model of the instrument, the detector, temperature, length and\
      \ diameter of the column, the brand and particle size of the sorbent, and the\
      \ composition of the eluent. For TLC, the adsorbent, eluent, and developing\
      \ reagent should be given.\n"
    explanation: ''
  1:
    text: Research Resource Identifiers (RRID) are persistent unique identifiers (effectively
      similar to a DOI) for research resources. This journal encourages authors to
      adopt RRIDs when reporting key biological resources (antibodies, cell lines,
      model organisms and tools) in their manuscripts.
    explanation: ''
  correct_answer: 0
  discrepancy_reason: Text not found
