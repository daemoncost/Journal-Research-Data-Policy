rdp_exist:
  text: 1. Existence of research data policy
  N. encoders: 3
  has_discrepancies: false
  0:
    text: Research Data Policy (RDP) exists.
    explanation: 'Research Data and supplementary materials: Note that publication
      of your manuscript implies that you must make all materials, data, and protocols
      associated with the publication available to readers. Disclose at the submission
      stage any restrictions on the availability of materials or information. Read
      the information about Supplementary Materials and Data Deposit for additional
      guidelines.'
  1:
    text: Research Data Policy (RDP) exists.
    explanation: "MDPI Research Data Policies\n\nMDPI is committed to supporting open\
      \ scientific exchange and enabling our authors to achieve best practices in\
      \ sharing and archiving research data. We encourage all authors of articles\
      \ published in MDPI journals to share their research data including, but not\
      \ limited to protocols, analytic methods, raw data, processed data, code, software,\
      \ algorithms, and study material. The data should be FAIR \u2013 findable, accessible,\
      \ interoperable, and reusable \u2013 so that other researchers can locate and\
      \ use the data.\nWe recommend that data and code should be deposited in a trusted\
      \ repository that will allow for maximum reuse (see the Data Preservation section\
      \ below). If this is not possible, authors are encouraged to share the specific\
      \ reason in the Data Availability Statement and make this material available\
      \ upon request to interested researchers. In addition, research materials necessary\
      \ to enable the reproduction of an experiment should be indicated in the Materials\
      \ and Methods section. Individual journal guidelines can be found at the journal\
      \ \u2018Instructions for Authors\u2019 page. Data sharing policies concern the\
      \ minimal dataset that supports the central findings of a published study. Generated\
      \ data should be publicly available and cited in accordance with journal guidelines."
  2:
    text: Research Data Policy (RDP) exists.
    explanation: "MDPI is committed to supporting open scientific exchange and enabling\
      \ our authors to achieve best practices in sharing and archiving research data.\
      \ We encourage all authors of articles published in MDPI journals to share their\
      \ research data including, but not limited to protocols, analytic methods, raw\
      \ data, processed data, code, software, algorithms, and study material. The\
      \ data should be FAIR \u2013 findable, accessible, interoperable, and reusable\
      \ \u2013 so that other researchers can locate and use the data.\n\nWe recommend\
      \ that data and code should be deposited in a trusted repository that will allow\
      \ for maximum reuse (see the Data Preservation section below). If this is not\
      \ possible, authors are encouraged to share the specific reason in the Data\
      \ Availability Statement and make this material available upon request to interested\
      \ researchers. In addition, research materials necessary to enable the reproduction\
      \ of an experiment should be indicated in the Materials and Methods section.\
      \ Individual journal guidelines can be found at the journal \u2018Instructions\
      \ for Authors\u2019 page. Data sharing policies concern the minimal dataset\
      \ that supports the central findings of a published study. Generated data should\
      \ be publicly available and cited in accordance with journal guidelines.\n\n\
      MDPI data policies are informed by TOP Guidelines.\n\nWhere ethical, legal,\
      \ or privacy issues are present, data should not be shared. The authors should\
      \ clarify the availability status of the data upon submission and make any limitations\
      \ or exceptions clear in the Data Availability Statement. Authors should ensure\
      \ that the data shared is in accordance with consent provided by participants\
      \ on the use of confidential data. Authors should ensure that the publication\
      \ of such data does not compromise the anonymity of the participants or breach\
      \ local data protection laws.\n\nIn situations where access is restricted to\
      \ protect confidential or proprietary information, authors will be requested\
      \ to clearly explain the restrictions on the dataset and make the data available\
      \ upon request, with permission for the purposes of peer review.\n\nMDPI recognizes\
      \ that some institutions and funding agencies only require the retention of\
      \ research data for a finite period after a project\u2019s completion or publication.\
      \ However, there are no such limits specified within the MDPI Data Availability\
      \ Policy and, therefore, we encourage the authors to archive their research\
      \ data through appropriate data repositories or provide us with minimal datasets\
      \ within Supplementary Material.\n\nData availability statements\n\nData availability\
      \ statements are required for all articles published with MDPI. During the peer-review\
      \ and editorial decision process, authors can be asked to share existing datasets\
      \ or raw data that have been analyzed in the manuscript, and whether they will\
      \ be made available to other researchers following publication. Authors will\
      \ also be asked for the details of any existing datasets that have been analyzed\
      \ in the manuscript."
  correct_answer: null
  discrepancy_reason: null
