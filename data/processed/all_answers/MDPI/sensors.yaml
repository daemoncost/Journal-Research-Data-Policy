    explanation: "MDPI Research Data Policies\n\nMDPI is committed to supporting open\
      \ scientific exchange and enabling our authors to achieve best practices in\
      \ sharing and archiving research data. We encourage all authors of articles\
      \ published in MDPI journals to share their research data including, but not\
      \ limited to protocols, analytic methods, raw data, processed data, code, software,\
      \ algorithms, and study material. The data should be FAIR \u2013 findable, accessible,\
      \ interoperable, and reusable \u2013 so that other researchers can locate and\
      \ use the data.\n\nWe recommend that data and code should be deposited in a\
      \ trusted repository that will allow for maximum reuse (see the Data Preservation\
      \ section below). If this is not possible, authors are encouraged to share the\
      \ specific reason in the Data Availability Statement and make this material\
      \ available upon request to interested researchers. In addition, research materials\
      \ necessary to enable the reproduction of an experiment should be indicated\
      \ in the Materials and Methods section. Individual journal guidelines can be\
      \ found at the journal \u2018Instructions for Authors\u2019 page. Data sharing\
      \ policies concern the minimal dataset that supports the central findings of\
      \ a published study. Generated data should be publicly available and cited in\
      \ accordance with journal guidelines.\n\nMDPI data policies are informed by\
      \ TOP Guidelines.\n\nWhere ethical, legal, or privacy issues are present, data\
      \ should not be shared. The authors should clarify the availability status of\
      \ the data upon submission and make any limitations or exceptions clear in the\
      \ Data Availability Statement. Authors should ensure that the data shared is\
      \ in accordance with consent provided by participants on the use of confidential\
      \ data. Authors should ensure that the publication of such data does not compromise\
      \ the anonymity of the participants or breach local data protection laws.\n\n\
      In situations where access is restricted to protect confidential or proprietary\
      \ information, authors will be requested to clearly explain the restrictions\
      \ on the dataset and make the data available upon request, with permission for\
      \ the purposes of peer review.\n\nMDPI recognizes that some institutions and\
      \ funding agencies only require the retention of research data for a finite\
      \ period after a project\u2019s completion or publication. However, there are\
