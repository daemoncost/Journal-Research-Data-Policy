  N. encoders: 1
  has_discrepancies: false
  0:
    text: Data sharing required but not publicly (e.g. available upon request is allowed).
    explanation: 'AIP Publishing believes that all datasets underlying the conclusions
      of the paper should be available to readers. We encourage authors to deposit
      their datasets in publicly available repositories (where available and appropriate)
      or present them in the main manuscript


      The data should include the minimal dataset needed to interpret, replicate,
      and build upon your findings.

      You can either deposit your datasets in a publicly available repository (where
      available or appropriate) or you can present them in the manuscript.

      To inform readers of where your data can be found, all manuscripts need to contain
      a data availability statement. Upon request and after permission of the third
      party'
