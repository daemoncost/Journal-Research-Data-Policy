rdp_exist:
  text: 1. Existence of research data policy
  N. encoders: 3
  has_discrepancies: false
  0:
    text: Research Data Policy (RDP) exists.
    explanation: "AIP Publishing believes that all datasets underlying the conclusions\
      \ of the paper should be available to readers. We encourage authors to deposit\
      \ their datasets in publicly available repositories (where available and appropriate)\
      \ or present them in the main manuscript.\n\nWhat is a data availability statement?\n\
      \nA data availability statements tells the reader where the data associated\
      \ with a paper is available, and where applicable, includes links to the data\
      \ set.\n\nWhat counts as data?\n\nBy data we mean the minimal dataset that would\
      \ be necessary to interpret, replicate, and build upon the findings reported\
      \ in the article. Some communities may have more specific standards and definition\
      \ of data.\n\nWhich journals does this policy apply to?\n\nData availability\
      \ statements are required for research published in all AIP Publishing journals.\n\
      \nHow should I write a data availability statement?\n\nAIP Publishing has prepared\
      \ a set of standard templates that you can use or adapt. Please review the author\
      \ guidelines for examples.\n\nWhy should I use a data repository?\n\nData repositories\
      \ make data more accessible and discoverable than sharing data via supplementary\
      \ information files. Public repositories generally assign a Digital Object Identifier\
      \ (DOI) to datasets which allows them to be cited in reference lists. Repositories\
      \ also support domain-specific data reporting standards and provide standardized\
      \ ways of structuring and identifying data.\n\nHow do I choose a data repository?\n\
      \nSome research communities are served by specific data repositories; your institutional\
      \ librarian, funder, or journal editor may make a recommendation. Researchers\
      \ can also use a general repository \u2013 such as Zenodo, figshare or Dryad\
      \ \u2013 that accept data from all disciplines. Certified repositories can also\
      \ be found through the Registry of Research Data Repositories (re3data.org),\
      \ FAIRsharing.org, or CoreTrustSeal.\n\nCan institutional repositories be used\
      \ for data?\n\nAIP Publishing authors may host their data in their institutional\
      \ or project specific repository."
  1:
    text: Research Data Policy (RDP) exists.
    explanation: In accordance with our Data Sharing Policy, all datasets supporting
      the conclusion of your paper need to be available to readers.
  2:
    text: Research Data Policy (RDP) exists.
    explanation: "If you\u2019re submitting your paper to an AIP Publishing journal,\
      \ you\u2019ll be asked to provide a data availability statement with your submission,\
      \ informing readers where the data can be found. Please be aware that some journals\
      \ in the portfolio may require that new data be made available at the time of\
      \ manuscript submission. "
  correct_answer: null
  discrepancy_reason: null
data_sharing:
  text: 3. Data sharing requirements in RDP
  N. encoders: 3
  has_discrepancies: true
  0:
    text: Data sharing required but not publicly (e.g. available upon request is allowed).
    explanation: "Below is a list of standard templates for the text that will appear\
      \ in the \u201CData Availability Statement\u201D portion of your article.  When\
      \ multiple data sets are being described, please provide information regarding\
      \ the data type for the benefit of the reader.\n\nDownload Data Availability\
      \ Statement Templates\nAvailability of data \tTemplate for data availability\
      \ statement\nData available on request from the authors \tThe data that support\
      \ the findings of this study are available from the corresponding author upon\
      \ reasonable request.\nData available in article or supplementary material \t\
      The data that supports the findings of this study are available within the article\
      \ [and its supplementary material].\nData openly available in a public repository\
      \ that issues datasets with DOIs \tThe data that support the findings of this\
      \ study are openly available in [repository name] at http://doi.org/[doi], reference\
      \ number [reference number].\nData openly available in a public repository that\
      \ does not issue DOIs \tThe data that support the findings of this study are\
      \ openly available in [repository name], reference number [reference number].\n\
      Data sharing not applicable \u2013 no new data generated \tData sharing is not\
      \ applicable to this article as no new data were created or analyzed in this\
      \ study.\nData generated at a central, large scale facility \tRaw data were\
      \ generated at the [facility name] large scale facility.  Derived data supporting\
      \ the findings of this study are available from the corresponding author upon\
      \ reasonable request.\nEmbargo on data due to commercial restrictions \tThe\
      \ data that support the findings will be available in [repository name] at [DOI\
      \ link] following an embargo from the date of publication to allow for commercialization\
      \ of research findings.\nData available on request due to privacy/ethical restrictions\
      \ \tThe data that support the findings of this study are available on request\
      \ from the corresponding author. The data are not publicly available due [state\
      \ restrictions such as privacy or ethical restrictions].\nData subject to third\
      \ party restrictions \tThe data that support the findings of this study are\
      \ available from [third party]. Restrictions apply to the availability of these\
      \ data, which were used under license for this study. Data are available from\
      \ the authors upon reasonable request and with the permission of [third party]."
  1:
