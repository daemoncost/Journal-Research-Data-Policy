data_timing:
  text: 7. Timing of data release
  N. encoders: 2
  has_discrepancies: true
  0:
    text: Required data must be available after an embargo period.
    explanation: 'Research Data Policy

      All ACS journals strongly encourage authors to make the research data underlying
      their articles publicly available at the time of publication.


      ...


      ACS Research Data Policy

      Where ethically and legally feasible, all ACS journals strongly encourage authors
      to make the research data underlying their articles publicly available at the
      time of publication. For the purposes of this policy, research data is defined
      as materials and information used in the experiments that enable the validation
      of the conclusions drawn in the article. This includes primary data produced
      by the authors for the study being reported, secondary data reused or analyzed
      by the authors for the study, and any other materials necessary to reproduce
      or replicate the results. To ensure data accessibility, we encourage the use
      of open licenses for reuse of data, such as Creative Commons CC BY. You can
      learn more about standard reuse licenses at the Open Access Licensing Options
      page on the ACS Publications website.


      ...


      Exceptions

      Exceptions to data availability requirements or embargoes delaying data release
      are available where legal or ethical issues prevent immediate public sharing.
      This includes data that may reveal personal information of research subjects,
      data where informed consent for public sharing was not granted, and other legitimate
      restrictions. In such cases, please contact the relevant journal editorial office
      to disclose the rationale and request an exception.'
  1:
