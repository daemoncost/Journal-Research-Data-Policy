    text: Journal policies require stating all dependencies and their versions that
      were used to run computational experiments.
    explanation: Details of the computations. The computed molecular model should
      be described clearly, possibly with a ChemDraw figure. If the model is based
      on an experimentally known complex/reaction, any modifications (such as truncations)
      should be clearly described and justified. Final optimized coordinates and keywords
      are to be provided. For DFT computations, the choice of functional must be justified,
      or the validation of the functional provided. The choice of basis sets must
      be explicitly discussed, including any deviation from standard basis sets. Convergence
      criteria, integration parameters, active space definition in multireference
      calculations, and, for open-shell systems, the way in which spin states are
      handled should be mentioned explicitly. The exact definition of any applied
      numerical or symmetry constraint should be indicated.  should be = required
