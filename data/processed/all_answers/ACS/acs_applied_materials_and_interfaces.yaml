rdp_exist:
  text: 1. Existence of research data policy
  N. encoders: 1
  has_discrepancies: false
  0:
    text: Research Data Policy (RDP) exists.
    explanation: 'Research Data Policy

      All ACS journals strongly encourage authors to make the research data underlying
      their articles publicly available at the time of publication.


      Research data is defined as materials and information used in the experiments
      that enable the validation of the conclusions drawn in the article, including
      primary data produced by the authors for the study being reported, secondary
      data reused or analyzed by the authors for the study, and any other materials
      necessary to reproduce or replicate the results.


      The ACS Research Data Policy provides additional information on Data Availability
      Statements, Data Citation, and Data Repositories.


      '
  correct_answer: null
  discrepancy_reason: null
data_sharing:
  text: 3. Data sharing requirements in RDP
  N. encoders: 1
  has_discrepancies: false
  0:
    text: Data sharing encouraged but optional.
    explanation: 'Data Requirements

      Particular attention should be given to ensuring that experimental procedures
      are reported in sufficient detail to allow full understanding by the expert
      reader to the extent that would allow ready reproduction of the experiments.
      (References to methods used in previous publications may be used, provided the
      details are very similar.) Technical details that are not essential, but would
      nevertheless be useful to anyone wanting to fully understand the experiments,
      may be included as Supporting Information. Rigorous attention to the control
      and measurement of experimental parameters should be described, including considerations
      of possible sources of systematic and statistical errors, such that the conclusions
      of the article may be fully justified. Careful consideration of significant
      figures (the number of digits that carry meaning relevant to the resolution
      of the measurement) should be given when reporting data in the abstract, text,
      and tables. It is especially important when describing device characterization
      to indicate how many devices were characterized and to differentiate between
      average, typical, and best-case results. The Virtual Issue on best practices
      for reporting the properties of materials and devices (http://pubs.acs.org/page/vi/best-practices.html
      ) provides useful guidance.


      As part of the Supporting Information, authors must provide an electronic copy
      of the structural data as a Crystallographic Information File (CIF) and must
      clearly notify the Editor in the cover letter that the manuscript contains structural
      data. (See the journal homepage for further instructions.) A checkcif file for
      each structure should also be uploaded as supporting information for review
      (https://checkcif.iucr.org).  Authors must confirm that the data in the CIF
      file correspond to the structures reported in the manuscript. During the review
      process, the CIFs will be available only to the reviewers of the manuscript
      and will remain confidential.  Authors should note that the ACS does not forward
      coordinates to crystallographic databases such as the Fachinformationszentrum
      Karlsruhe (FIZ) or the Cambridge Structural Database (CSD). This is the responsibility
      of the author.


      '
  correct_answer: null
  discrepancy_reason: null
