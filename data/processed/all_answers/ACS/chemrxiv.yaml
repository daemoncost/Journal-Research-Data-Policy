data_availability:
  text: 2. Data availability statement
  N. encoders: 1
  has_discrepancies: false
  0:
    text: Mentioned in the RDP but optional.
    explanation: 'Data Availability


      Corresponding authors are encouraged to make the data underpinning their research
      available to others and to abide by the principles of data sharing as outlined
      by the FAIR Principles [opens in a new tab]. This means that any data shared
      should be findable, accessible, interoperable, and reusable. Authors sharing
      their data should do so ideally through an appropriate subject-specific repository
      such as CCDC or Chemotion, or a general repository such as Dryad, figshare,
      Zenodo, or Dataverse. You can also search for an appropriate repository via
      re3data.org [opens in a new tab]. Authors should include a Data Availability
      Statement within their content to let readers know whether data have been made
      available, and if so, where and how they can be accessed. Supporting materials
      or weblinks can also be provided during the upload process.'
  correct_answer: null
  discrepancy_reason: null
