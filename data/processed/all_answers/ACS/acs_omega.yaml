      \ encourage authors to make the research data underlying their articles publicly\
      \ available at the time of publication. \""
  correct_answer: null
  discrepancy_reason: null
data_sharing:
  text: 3. Data sharing requirements in RDP
  N. encoders: 2
  has_discrepancies: true
  0:
    text: Public data sharing required only for specific types of data.
    explanation: 'Data Requirements

      Advancing scientific discoveries can be enhanced when data and materials are
      made available and readily exchanged. ACS Omega requires that authors adhere
      to the standards for reporting and characterization of data. It is also recommended
      that authors deposit data in databases appropriate to their fields.'
  1:
    text: Data sharing encouraged but optional.
    explanation: "no text in the Journal Research Data Policy but referred to the\
      \ Publishers (ACS) Research Data Policy. \n\nText from Publishers (ACS) Research\
      \ Data Policy : \n\" ACS strongly endorses The FAIR Data Principles and believes\
      \ that where ethically and legally feasible, all research data should be findable,\
      \ accessible, interoperable, and reusable. \"\nAlso, no mention about the journal\
      \ policy level, but the lowest among them, policy level 1, Encourages Data Sharing.\n\
      \n\" Data Requirements\nParticular attention should be given to ensuring that\
      \ experimental procedures are reported in sufficient detail to allow full understanding\
      \ by the expert reader to the extent that would allow ready reproduction of\
      \ the experiments. \nAs part of the Supporting Information, authors must provide\
      \ an electronic copy of the structural data as a Crystallographic Information\
      \ File (CIF) and must clearly notify the Editor in the cover letter that the\
      \ manuscript contains structural data.\nAuthors must confirm that the data in\
      \ the CIF file correspond to the structures reported in the manuscript. During\
      \ the review process, the CIFs will be available only to the reviewers of the\
      \ manuscript and will remain confidential.\""
  correct_answer:
