data_sharing_method:
  text: 8. Recommended data sharing method
  N. encoders: 2
  has_discrepancies: true
  0:
    text: Multiple data sharing methods equally recommended in RDP.
    explanation: '

      Protein Structures: The atomic coordinates and related experimental data associated
      with a structure reported in ACS journals must be deposited at a member site
      of the Worldwide Protein Data Bank: RCSB PDB, PDBe, PDBj, or BMRB. The PDB ID
      should be included in the manuscript. Authors must upload map density files,
      PDB files and PDB validation reports as Supporting Information for Review only.
      Authors must agree to release the atomic coordinates and experimental data when
      the associated article is published. A manuscript will be accepted only after
      receipt from the submitting author of a written statement that the coordinates
      have been deposited. Coordinates must be released immediately upon publication.

      X-Ray Crystallographic Structures of Small Molecules: Crystallographic data
      on nucleosides, nucleotides, and other small molecules should be submitted upon
      publication to the Cambridge Structural Database. Crystal structures of nucleic
      acids should be deposited with the Nucleic Acid Database (NDB) at Nucleic Acid
      Database (NDB) or with the RCSB PDB at RCSB Protein Data Bank - RCSB PDB.'
