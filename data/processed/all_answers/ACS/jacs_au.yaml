data_citability:
  text: '5. Citability and findability of data '
  N. encoders: 2
  has_discrepancies: true
  0:
    text: DOIs or other persistent identifiers recommended for datasets or codes.
    explanation: 'What information is needed in the Data Availability Statement?

      At a minimum, the statement should indicate that all data underlying the study
      are available in the published article or its Supporting Information. If additional
      data are available and not included with the article, authors should indicate
      how to access the data, for example, by including the names and hyperlinks to
      repositories where the data may be found, such as a discipline-specific or community-recognized
      repository, or generalist repository when no other resource is available. See
      examples of Data Availability Statements, as well as guidance on selecting a
      repository.


      Data repositories supporting peer-reviewed publications generally should meet
      the following criteria:


      Ensure long-term persistence and preservation of datasets (minimum of 5 years
      after publication)


      Be supported by a research community or research institution


      Provide deposited datasets with stable and persistent identifiers, e.g., Digital
      Object Identifiers (DOIs)


      Allow access to data without restrictions


      Provide clear terms of data use and data access (or license) on each dataset
      landing page'
