data_availability:
  text: 2. Data availability statement
  N. encoders: 2
  has_discrepancies: false
  0:
    text: Mentioned in the RDP but optional.
    explanation: 'Is a Data Availability Statement required for publication?

      ACS is conducting a Data Availability Statement pilot program with Organic Letters,
      The Journal of Organic Chemistry, and ACS Organic & Inorganic Au. A Data Availability
      Statement is required for these three journals during the pilot program for
      all peer-reviewed articles. Manuscripts submitted to these journals prior to
      September 15, 2022 will not be included in the pilot. A Data Availability Statement
      is not required for other ACS journals at this time but is highly encouraged.
      With results from the pilot program, ACS will decide on future requirements
      for all its journals.


      Is a Data Availability Statement required for every article?

      A Data Availability Statement is required for all peer-reviewed articles in
      Organic Letters, The Journal of Organic Chemistry, and ACS Organic & Inorganic
      Au. A Data Availability Statement is not required for the following non-peer-reviewed
      articles, but is encouraged if new data are being presented: Addition/Correction,
      Editorial, Expression of Concern, or Retraction.'
  1:
    text: Mentioned in the RDP but optional.
    explanation: "Not explicitly mentioned in the Journal Research Data Policy but\
      \ mentioned in the Publishers (ACS) Research Data Policy. \n\nText from Publishers\
      \ (ACS) Research Data Policy:\n(Level 1 Public data availability encouraged\
      \ :) \" Authors are encouraged to provide a Data Availability Statement describing\
      \ the public availability of the data supporting the article\u2019s conclusions.\
      \ \" "
