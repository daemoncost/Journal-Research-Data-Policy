      to make the research data underlying their articles publicly available at the
      time of publication. For the purposes of this policy, research data is defined
      as materials and information used in the experiments that enable the validation
      of the conclusions drawn in the article. This includes primary data produced
      by the authors for the study being reported, secondary data reused or analyzed
      by the authors for the study, and any other materials necessary to reproduce
      or replicate the results. To ensure data accessibility, we encourage the use
      of open licenses for reuse of data, such as Creative Commons CC BY. You can
      learn more about standard reuse licenses at the Open Access Licensing Options
      page on the ACS Publications website.'
