code_required:
  text: 13. Code sharing requirements
  N. encoders: 2
  has_discrepancies: false
  0:
    text: Code sharing not mentioned.
    explanation: 'Computations


      When computational results are part of a manuscript, sufficient detail must
      be given, either within the manuscript or in the Supporting Information, to
      enable readers to reproduce the calculations. This includes data such as force
      field parameters and equations defining the model (or references to where such
      material is available in the open literature). If the software used for calculations
      is generally available, it must be properly cited in the References and Footnotes.
      References to the methods upon which the software is based must also be provided.
      Results obtained from methods or parameters that are not adequately described
      in the manuscript or in the literature are not acceptable for publication. Authors
      who report the results of electronic structure calculations are requested to
      provide as Supporting Information the geometries (either as Cartesian coordinates
      or Z matrices) of all the stationary points whose relative energies are given
      in the manuscript. The absolute energies in hartrees that are computed at these
      geometries should not be given in the manuscript but should be included in the
      Supporting Information. Where applicable, the number of imaginary frequencies
      should be reported to identify stable structures and transition states.'
  1:
    text: Code sharing not mentioned.
    explanation: no text.
  correct_answer: null
  discrepancy_reason: null
