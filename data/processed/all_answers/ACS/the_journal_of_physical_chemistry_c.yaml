    explanation: 'Data Requirements

      Reproducibility of Results

      It is essential that papers provide enough information so that calculations
      and experiments can be reproduced by others. We encourage authors to use Supporting
      Information for this purpose, which is publicly available free of charge on
      the internet upon publication, regardless of whether or not the accompanying
      article is made open access.'
