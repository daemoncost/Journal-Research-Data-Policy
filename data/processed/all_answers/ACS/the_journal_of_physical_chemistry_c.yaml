data_sharing_method:
  text: 8. Recommended data sharing method
  N. encoders: 2
  has_discrepancies: true
  0:
    text: Multiple data sharing methods equally recommended in RDP.
    explanation: "Guidelines for Computational Results\nBelow are the general guidelines\
      \ from Pure Appl. Chem. 1998, 70, No. 10, 2047\u20132049 (http://dx.doi.org/10.1351/pac199870102047)\
      \ for manuscripts reporting the results of electronic structure calculations,\
      \ force field parameters, and other potential energy surface information. Further\
      \ details are listed in the guidelines authored by J. E. Boggs (Pure Appl. Chem.\
      \ 1998, 70, No. 4, 1015\u20131018 (http://dx.doi.org/10.1351/pac199870041015).\
      \ Both sets of guidelines can be viewed online at http://iupac.org/publications/pac/reports/year/1998/.\
      \ While these papers refer to electronic structure and molecular dynamics calculations,\
      \ the concepts stated below apply to all calculations.\n\nIf a paper mentions\
      \ any calculations that are integral to the study (i.e., the precise quantitative\
      \ results are central to the conclusions drawn) computational details must be\
      \ described.\nReproducibility of computations should be a defining goal in reporting\
      \ computational results. Sufficient technical details should be provided to\
      \ allow a reader to reproduce the results of any calculations. Of course, strict\
      \ reproducibility of computations may be precluded by differences among computers\
      \ (e.g., differences in operating systems, host-based algorithms, machine precision,\
      \ etc.), software (e.g., installation procedures and programming modifications),\
      \ and applications (e.g., for probabilistic methods such as Monte Carlo calculations).\n\
      A description of the results of any published calculation must be available\
      \ for scientific scrutiny by other investigators. Ordinarily this will best\
      \ be achieved if the authors place full details of the calculation (e.g., structures,\
      \ energies, frequencies, dynamical quantities, etc.) in a repository (such as\
      \ Supporting Information to the paper) that is accessible via the Internet.\
      \ Otherwise, it is the responsibility of the investigator to make such information\
      \ available upon request. Depending on the specific circumstances, the appropriate\
      \ data to be deposited might be final output structure(s) or the input structure(s)\
      \ that would allow another investigator to replicate the computational experiment.\n\
      Electronically deposited structures should be written in a format that is machine\
      \ readable by readily available modelling or translating programs.\nAn adequate\
      \ specification of the computer program used to carry out the calculations is\
      \ essential. If the calculations were carried out with commercially available\
      \ software, the investigator must list the source, version number, and force\
      \ field employed. Any program modifications and any differences from the published\
      \ version (including changes in parameters) must be fully described or available\
      \ to other investigators upon request. Changes in parameters, program options\
      \ (e.g., dielectric constant, nonbonded cutoffs, etc.) affecting reproducibility\
      \ of the calculation, and program constraints must be fully described in the\
      \ article. If the program is not available, commercially or otherwise, the authors\
      \ must specify sufficient detail that the calculation could be reproduced.\n\
      The issue of convergence must be adequately addressed. An iterative calculation\
      \ is considered to have converged when further iterations will not significantly\
      \ alter the results. Convergence criteria should be reported (e.g., energy change\
      \ per iteration or energy gradient for geometry optimization of a single structure).\
      \ \n\nGuidelines for Experiments\nAuthors are expected to provide sufficient\
      \ detail to enable a trained professional to reproduce routine measurements\
      \ and synthetic procedures. Authors are required to provide crystallographic\
      \ or surface structure data as Supporting Information in crystallographic information\
      \ file (CIF) format. For quantitative optical measurements, the specifics and\
      \ usable range of the photodetector should be reported.\n\nTeams of ACS editors\
      \ have identified best practices in certain fields to guide authors in the reporting\
      \ of experimental results. Please refer to them, as needed:\n\nBest Practices\
      \ for the Reporting of Colloidal Inorganic Nanomaterials (http://pubs.acs.org/doi/abs/10.1021/acs.chemmater.5b02323)\n\
      Best Practices for Reporting on Heterogeneous Photocatalysis (http://pubs.acs.org/doi/abs/10.1021/am504389z)\n\
      Best Practices in Perovskite Solar Cell Efficiency Measurements. Avoiding the\
      \ Error of Making Bad Cells Look Good (http://pubs.acs.org/doi/abs/10.1021/acs.jpclett.5b00289)\n\
      Best Practices for Reporting on Energy Storage (http://pubs.acs.org/doi/abs/10.1021/acsami.5b06029)\n\
      Best Practice in Photocatalysis: Comparing Rates of Apparent Quantum Yields?\
      \ (http://pubs.acs.org/doi/abs/10.1021/acs.jpclett.5b00521)"
  1:
    text: Data sharing in supplementary material or hosting by journal recommended
      in RDP.
    explanation: "Text from Journal Research Data Policy : \n\" If the manuscript\
      \ is accompanied by any supporting information files for publication, these\
      \ files will be made available free of charge to readers. \"\n\nText from Publishers\
