code_required:
  text: 13. Code sharing requirements
  N. encoders: 2
  has_discrepancies: true
  0:
    text: Code sharing encouraged but optional.
    explanation: "Authors should supply enough Supporting Information to reproduce\
      \ the calculations or to make the results utilizable without repeating the calculations.\
      \ Computational manuscripts should include at least the following Supporting\
      \ Information:\n\nDescription of specific programs and the release or version.\
      \ Authors should check and comply with citation requests of the program packages\
      \ used. If the author\u2019s own or a modified version of a commercially available\
      \ program is used, it is required that the program/code/modification be made\
      \ available to the scientific community (QCPE, publication in a computational\
      \ journal, commercially, etc.), if the license permits. Policies in this regard\
      \ are identical with those of several other ACS journals, as summarized in J.\
      \ Chem. Inf. Model. 2006, 46, 937.A clear exposition of any nonstandard equations\
      \ and algorithms used and, where feasible, tests of the codes in various limiting\
      \ cases should also be provided. \nDetails of the computations. The computed\
      \ molecular model should be described clearly, possibly with a ChemDraw figure.\
      \ If the model is based on an experimentally known complex/reaction, any modifications\
      \ (such as truncations) should be clearly described and justified. Final optimized\
      \ coordinates and keywords are to be provided. For DFT computations, the choice\
      \ of functional must be justified, or the validation of the functional provided.\
      \ The choice of basis sets must be explicitly discussed including any deviation\
      \ from standard basis sets. Convergence criteria, integration parameters, active\
      \ space definition in multireference calculations, and, for open-shell systems,\
      \ the way in which spin states are handled should be mentioned explicitly. The\
      \ exact definition of any applied numerical or symmetry constraint should be\
      \ indicated.\nDetails of the computational results. When relevant to the results\
      \ of the study, data such as absolute energies, gross orbital populations, atomic\
      \ spin densities, etc., should be supplied. Where feasible, critical checkpoint/restart\
      \ files should be saved and made available upon request.\nCartesian Coordinates.\
      \ Cartesian coordinates of all molecules, intermediates, transition states,\
      \ etc. that are part of the manuscript must be uploaded in a single file that\
      \ is formatted for convenient viewing with widely available molecular modeling\
      \ packages. The .xyz and .mol formats are accepted at this time. The .xyz format\
      \ is the most basic and easily prepared from computational output. More information\
      \ on the .xyz file format is available at http://openbabel.sourceforge.net/wiki/XYZ.\n\
      \nThe first line of the .xyz format file denotes the number of atoms in the\
      \ molecule.\n\nThe second line of the file is a comments line, and should begin\
      \ with a descriptive name of the molecule/structure consistent with the designation\
      \ in the manuscript, and any other pertinent information selected by the author,\
      \ such as total energy.\n\nNext follow lines for each element in the molecule.\
      \ Each line contains the element symbol followed by the x, y, and z coordinates\
      \ in angstroms (\xC5) separated by spaces in free-field format (i.e. precise\
      \ formatting not required).\n\nMultiple structures are placed directly end-to-end\
      \ in the file. The file name should have the extension \u201C.xyz\u201D.\n\n\
      It is strongly recommended that authors view the structures in the file with\
      \ a modeling program before uploading the file. The program Mercury (version\
      \ 3.3 or later) is recommended for viewing and manipulating the multiple structures.\
      \ The Cambridge Crystallographic Data Centre (CCDC) offers Mercury at no cost.\
      \ Include the phrase \u201Ca text file of all computed molecule Cartesian coordinates\
      \ in a format for convenient visualization\u201D in the Supporting Information\
      \ statement.\n\nFor additional guidance, see the ACS Simulations, Machine Learning,\
      \ Computational Data guidelines."
  1:
    text: Code sharing not mentioned.
    explanation: no text.
  correct_answer: 0
  discrepancy_reason: Text not found
