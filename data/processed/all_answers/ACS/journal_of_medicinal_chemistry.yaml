data_availability:
  text: 2. Data availability statement
  N. encoders: 2
  has_discrepancies: false
  0:
    text: Mentioned in the RDP but optional.
    explanation: 'What is a Data Availability Statement, and why am I being asked
      to provide one in my manuscript?

      As part of its ACS Research Data Policy, which is based upon FAIR Data Principles,
      ACS strongly encourages authors submitting manuscripts to its portfolio of journals
      to make all research data underlying their manuscripts publicly available. A
      Data Availability Statement is a formal way within your manuscript to indicate
      how others can access your research data to aid them in repeating experiments,
      designing new experiments, and helping advance scientific research.


      Is a Data Availability Statement required for publication?

      ACS is conducting a Data Availability Statement pilot program with Organic Letters,
      The Journal of Organic Chemistry, and ACS Organic & Inorganic Au. A Data Availability
      Statement is required for these three journals during the pilot program for
      all peer-reviewed articles. Manuscripts submitted to these journals prior to
      September 15, 2022 will not be included in the pilot. A Data Availability Statement
      is not required for other ACS journals at this time but is highly encouraged.
      With results from the pilot program, ACS will decide on future requirements
      for all its journals.'
  1:
    text: Mentioned in the RDP but optional.
    explanation: "Referred to Publishers (ACS) Research Data Policy. \n\nThe ACS Research\
      \ Data Policy provides additional information on Data Availability Statements,\
