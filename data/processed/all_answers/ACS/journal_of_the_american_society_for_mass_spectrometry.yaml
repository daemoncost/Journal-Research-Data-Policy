data_recommended:
  text: '11. Unique policies for data types

    Please name all data types for which unique policies are recommended according
    to the RDP (Please separate all data types be semicolon, e.g. crystal structures;
    Protein sequence)'
  N. encoders: 2
  has_discrepancies: true
  0:
    text: 'The Use of High Resolution Mass Spectral Data for Formula Confirmation:
      For publication of exact- mass data that are used to confirm identities of synthetic
      and natural products, report the uncertainty in the accurate-mass measurement
      used for formula verification along with the result. The acceptable uncertainty
      in a measurement by any analytical method must be adequate for the intended
      use of the data.


      Evaluate the uncertainty of accurate mass measurement by any statistically valid
      method. Determine, for example, the precision and accuracy of replicate measurements
      or evaluate the performance characteristics of the mass spectrometer (see, for
      example, Sack, T. M., Lapp, R. L., Gross, M. L., and Kimble, B. J. Int. J. Mass
      Spectrom. Ion Proc. 1984, 61, 191-213).


      Consider all candidates fitting the experimentally determined value and its
      reported uncertainty when the result of accurate mass measurement is used for
      formula confirmation. Do not set fixed acceptable error limits for exact mass
      measurement. Consider the following when using accurate mass data.


      When valence rules and candidate compositions encompassing C0-100, H3-74, O0-4,
      and N0-4 are considered at nominal parent m/z of 118, there are no candidate
      formulae within 34 ppm of each other. When the ion is of m/z 750.4 and the formulae
      are in the range C0-100, H25-110, O0-15, and N0-15, there are 626 candidate
      formulae that are possible within 5 ppm. Thus, for a measurement at m/z 118,
      an error of only 34 ppm uniquely defines a particular formula, whereas at m/z
      750, an error (and precision) of 0.018 ppm would be required to eliminate all
      extraneous possibilities.'
    explanation: ''
  1:
