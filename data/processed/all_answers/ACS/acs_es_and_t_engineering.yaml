data_fair:
  text: 4. FAIR data sharing (see https://www.go-fair.org/fair-principles/ for a definition
    of FAIR)
  N. encoders: 2
  has_discrepancies: true
  0:
    text: Public data sharing on a FAIR repository encouraged.
    explanation: 'Choosing an Appropriate Data Repository

      Where possible, ACS recommends authors deposit data in discipline-specific,
      community-recognized repositories or in generalist repositories when no community
      resource is available. Authors should consult the journal Author Guidelines
      for specific repository recommendations or requirements for data types.


      ACS strongly encourages authors to select a repository that issues a persistent
      unique identifier, such as a DOI or an Accession Number. This will help facilitate
      the discoverability and citation of deposited data. Repositories that focus
      on research data, are managed by a sustainable institution (such as a professional
      society or university), have a plan for long-term storage of and access to the
      data, and provide clear information about terms of use of the data are preferred.


      To find an appropriate repository, authors may refer to re3data.org and FAIRsharing.org
      for information on available repositories, their certification status, and services
      offered.'
