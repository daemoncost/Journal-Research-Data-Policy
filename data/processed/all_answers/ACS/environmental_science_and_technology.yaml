data_sharing:
  text: 3. Data sharing requirements in RDP
  N. encoders: 2
  has_discrepancies: false
  0:
    text: Data sharing encouraged but optional.
    explanation: "Data Presentation\n\nData should be presented in a way that makes\
      \ interpretation clear to the reader.\n\nFor more information on data presentation,\
      \ see:\n\nQuantifying the Interactions between Biomolecules: Guidelines for\
      \ Assay Design and Data Analysis\n\nBeyond Bar and Line Graphs: Time for a New\
      \ Data Presentation Paradigm\n\nReporting standards and availability of data,\
      \ materials, code and protocols.\n-------> LINK TO NATURE SPRINGER guidelines\n\
      \nMIQE guidelines for ddPCR and QPCR by Bustin et al. 2009 and Hugget et al.\
      \ 2020; EMMI guidelines by Borchardt et al. 2021\n\nBest practice for 16S Microbiome\
      \ studies\n\n\nDatabase Deposition\n\nAdvancing scientific discoveries can be\
      \ enhanced when data and materials are made available and readily exchanged.\
      \ ES&T requires for all published articles that authors make materials, data,\
      \ and protocols available to readers through deposition in a public database.\
      \ A statement must appear in the submitted manuscript confirming submission\
      \ of the data and indicating the data bank and any pertinent accession codes/ID.\n\
      \nTo identify the repository that meets your particular needs, you may find\
      \ FAIR Sharing Databases, Registry of Research Data Repositories, and Repository\
      \ Finder helpful. Authors may also want to further investigate unstructured\
      \ and/or large data repositories, such as Dryad Digital Repository, figshare,\
      \ Open Science Framework, and Zenodo, or institutional repositories for depositing\
      \ data. If there is no appropriate repository available, general publicly available\
      \ repositories should be used.\n\nIn addition, ACS Publications\u2019 figshare\
      \ houses all Supporting Information within the HTML presentation of the paper\
      \ and at acs.figshare.com. Authors also agree to make available to interested\
      \ academic researchers for their own use any materials reported in the manuscript\
      \ that are not otherwise obtainable. Any restrictions to the availability of\
      \ materials or information must be stated at the time of submission. The ACS\
      \ Math Style Sheet and NMR Guidelines are available on the ACS Publishing Center."
  1:
    text: Data sharing encouraged but optional.
    explanation: "Text from Publishers (ACS) Research Data Policy : \n\" ACS strongly\
      \ endorses The FAIR Data Principles and believes that where ethically and legally\
      \ feasible, all research data should be findable, accessible, interoperable,\
      \ and reusable. \"\nAlso, no mention about the journal policy level, but the\
      \ lowest among them, policy level 1, Encourages Data Sharing.\n\nText from Journal\
      \ Research Data Policy : \n\" Database Deposition\n  Advancing scientific discoveries\
      \ can be enhanced when data and materials are made available and readily exchanged.\
      \ ... \n  To identify the repository that meets your particular needs, you may\
      \ find FAIR Sharing Databases, Registry of Research Data Repositories, and Repository\
      \ Finder helpful. \""
