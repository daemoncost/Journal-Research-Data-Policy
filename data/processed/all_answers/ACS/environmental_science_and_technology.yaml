rdp_exist:
  text: 1. Existence of research data policy
  N. encoders: 2
  has_discrepancies: false
  0:
    text: Research Data Policy (RDP) exists.
    explanation: 'Research Data Policy

      All ACS journals strongly encourage authors to make the research data underlying
      their articles publicly available at the time of publication.


      Research data is defined as materials and information used in the experiments
      that enable the validation of the conclusions drawn in the article, including
      primary data produced by the authors for the study being reported, secondary
      data reused or analyzed by the authors for the study, and any other materials
      necessary to reproduce or replicate the results.


      The ACS Research Data Policy provides additional information on Data Availability
      Statements, Data Citation, and Data Repositories.'
